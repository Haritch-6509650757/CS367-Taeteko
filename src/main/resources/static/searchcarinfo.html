<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Car Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .toolbar {
            background: linear-gradient(to right, #004080, #007BFF);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .toolbar a:hover {
            background-color: #0056b3;
            color: #e6f0ff;
        }

        h1 {
            color: #004080;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        form {
            max-width: 400px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #004080;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background: linear-gradient(to right, #007BFF, #0056b3);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #003d80;
            transform: scale(1.05);
        }

        #response {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #004080;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #004080;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f4f4f4;
        }

        tr:hover {
            background-color: #e6f0ff;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="indexwarehouse.html">Home</a>
        <a href="returncar.html">Return Car</a>
        <a href="customeraction.html">Customer Action</a>
        <a hrft="searchcarinfo.html">Search Car Info</a>
    </div>

    <h1>Search Car Info</h1>
    <form id="searchForm">
        <label for="carPlateNumber">Enter Car Plate Number:</label>
        <input type="text" id="carPlateNumber" placeholder="e.g., AB1234" required>
        <button type="submit">Search</button>
    </form>

    <div id="response"></div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const responseDiv = document.getElementById('response');

        searchForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const carPlateNumber = document.getElementById('carPlateNumber').value;

            try {
                const response = await fetch(`/warehouse/info/storefront?carPlateNumber=${carPlateNumber}`);
                const result = await response.json();

                responseDiv.style.color = 'black';

                if (response.ok) {
                    responseDiv.innerHTML = `
                        <table>
                            <tr><th>Field</th><th>Value</th></tr>
                            ${Object.entries(result).map(([key, value]) => `
                                <tr>
                                    <td>${key}</td>
                                    <td>${value}</td>
                                </tr>
                            `).join('')}
                        </table>
                    `;
                } else {
                    responseDiv.innerText = result.message || 'Car not found.';
                    responseDiv.style.color = 'red';
                }
            } catch (error) {
                responseDiv.innerText = 'Car not found. Please check the plate number and try again.';
                responseDiv.style.color = 'red';
            }
        });
    </script>
</body>
</html>
