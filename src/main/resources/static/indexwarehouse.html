<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าเริ่มต้น</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://www.bmw.co.th/content/dam/bmw/common/all-models/m-series/xm/2023/highlights/bmw-x-series-xm-phev-mc-electric-driving-hero-desktop.jpg/jcr:content/renditions/cq5dam.resized.img.1680.large.time1719322211323.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .toolbar {
            background-color: rgba(0, 64, 128, 0.8);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .toolbar a:hover {
            background-color: #0056b3;
            color: #e6f0ff;
        }

        h1 {
            color: #ffffff;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            margin-top: 100px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        p {
            text-align: center;
            font-size: 20px;
            color: #f0f0f0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="toolbar">
        <a href="indexwarehouse.html">Home</a>
        <a href="returncar.html">Return Car</a>
        <a href="customeraction.html">Customer Action</a>
    </div>

    <h1>ยินดีต้อนรับสู่ระบบจัดการรถ</h1>
    <p>เลือกเมนูด้านบนเพื่อเริ่มต้นใช้งาน</p>
</body>
</html>
