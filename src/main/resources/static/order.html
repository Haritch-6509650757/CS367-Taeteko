<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สั่งจองรถ</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #333;
            padding: 0;
            margin: 0;
        }

        .toolbar {
            background: linear-gradient(to right, #004080, #007BFF);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .toolbar a:hover {
            background-color: #0056b3;
            color: #e6f0ff;
        }

        h1 {
            color: #004080;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            text-align: center;
            font-size: 18px;
            color: #555;
        }

        form {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #004080;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[readonly] {
            background-color: #f0f0f0;
            color: #666;
            cursor: not-allowed;
        }

        button {
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="index.html">หน้าเริ่มต้น</a>
        <a href="available-cars.html">รถที่พร้อมใช้งาน</a>
    </div>

    <h1>สั่งจองรถ</h1>
    <p>กรุณาเลือกข้อมูลรถที่ต้องการจอง</p>

    <form id="orderForm">
        <label>ทะเบียนรถ</label>
        <input type="text" id="carPlateNumber" name="carPlateNumber" readonly>

        <label>ชื่อผู้เช่า</label>
        <input type="text" name="customerName" required>

        <label>รหัสสาขา</label>
        <input type="text" name="storeId" value="rental168" readonly>

        <label>หมายเหตุ</label>
        <textarea name="remarks"></textarea>

        <label>วันที่สั่งจอง</label>
        <input type="date" name="orderDate" required>

        <label>วันที่ส่งมอบ</label>
        <input type="date" name="deliveryDate" required>

        <button type="submit">ส่งคำสั่ง</button>
    </form>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('carPlateNumber').value = params.get('plate') || '';

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.status = 'จองแล้ว';
            data.lastUpdated = new Date().toISOString();

            fetch('http://localhost:8080/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(res => res.text())
            .then(result => {
                alert('สั่งจองสำเร็จ: ' + result);
                window.location.href = 'index.html';
            })
            .catch(err => {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการส่งคำสั่ง');
            });
        });
    </script>
</body>
</html>
