<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>สั่งจองรถ</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #333;
            padding: 0;
            margin: 0;
        }

        .toolbar {
            background: linear-gradient(to right, #004080, #007BFF);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .toolbar a:hover {
            background-color: #0056b3;
            color: #e6f0ff;
        }

        h1 {
            color: #004080;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            text-align: center;
            font-size: 18px;
            color: #555;
        }

        form {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #004080;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[readonly] {
            background-color: #f0f0f0;
            color: #666;
            cursor: not-allowed;
        }

        button {
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <a href="index.html">หน้าเริ่มต้น</a>
        <a href="available-cars.html">รถที่พร้อมใช้งาน</a>
    </div>

    <h1>สั่งจองรถ</h1>
    <p>กรุณาเลือกข้อมูลรถที่ต้องการจอง</p>

    <form id="orderForm">
        <label>ทะเบียนรถ</label>
        <input type="text" id="carPlateNumber" name="carPlateNumber" readonly>

        <label>ชื่อผู้เช่า</label>
        <input type="text" name="customerName" required>

        <label>รหัสสาขา</label>
        <input type="text" name="storeId" value="rental168" readonly>

        <label>หมายเหตุ</label>
        <textarea name="remarks"></textarea>

        <label>วันที่สั่งจอง</label>
        <input type="date" name="orderDate" required>

        <label>วันที่ส่งมอบ</label>
        <input type="date" name="deliveryDate" required>

        <button type="submit">ส่งคำสั่ง</button>
    </form>

    <div id="resultModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center;">
        <div
            style="background: white; padding: 20px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%;">
            <p id="resultMessage" style="font-size: 18px; margin-bottom: 20px;"></p>
            <button id="backButton"
                style="background-color: #007BFF; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer;">กลับหน้าหลัก</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('carPlateNumber').value = params.get('plate') || '';

        document.getElementById('orderForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.status = 'InProgress';
            data.lastUpdated = new Date().toISOString();

            fetch('/order/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(res => {
                    if (!res.ok) {
                        return res.text().then(text => { throw new Error(text); });
                    }
                    return res.text();
                })
                .then(result => {
                    const successMessage = parseSuccessMessage(result);
                    showModal(successMessage);
                })
                .catch(err => {
                    const errorMessage = parseErrorMessage(err.message);
                    showModal(errorMessage);
                });
        });

        function parseSuccessMessage(response) {
            if (response.includes("Car is ready")) {
                return "สั่งจองรถสำเร็จ: รถพร้อมใช้งานและสถานะถูกอัปเดตเรียบร้อยแล้ว";
            } else if (response.includes("Car is broken")) {
                return "สั่งจองรถไม่สำเร็จ: รถมีปัญหาและไม่สามารถใช้งานได้";
            }
            return "สั่งจองรถสำเร็จ: รายการของคุณถูกบันทึกเรียบร้อยแล้ว";
        }


        function showModal(message) {
            const modal = document.getElementById('resultModal');
            const messageElement = document.getElementById('resultMessage');
            const backButton = document.getElementById('backButton');

            messageElement.textContent = message;
            modal.style.display = 'flex';

            backButton.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>

</html>
