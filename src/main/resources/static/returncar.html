<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Car</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .toolbar {
            background: linear-gradient(to right, #004080, #007BFF);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .toolbar a:hover {
            background-color: #0056b3;
            color: #e6f0ff;
        }

        h1 {
            color: #004080;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(to right, #007BFF, #0056b3);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        button:hover {
            background-color: #003d80;
            transform: scale(1.05);
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #004080;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f4f4f4;
        }

        tr:hover {
            background-color: #e6f0ff;
        }

        #response {
            max-width: 90%;
            margin: 20px auto;
            padding: 10px;
            background-color: #e6f0ff;
            border: 1px solid #004080;
            border-radius: 6px;
            color: #004080;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="indexwarehouse.html">Home</a>
        <a href="returncar.html">Return Car</a>
        <a href="customeraction.html">Customer Action</a>
        <a href="searchcarinfo.html">Search Car Info</a>
    </div>

    <h1>Return Car</h1>
    <div class="button-group">
        <button id="fetchCarsButton">Return All Cars</button>
    </div>
    <div id="response"></div>
    <table id="carTable" style="display: none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Plate Number</th>
                <th>Brand</th>
                <th>Ready to Return</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const fetchCarsButton = document.getElementById('fetchCarsButton');
        const responseDiv = document.getElementById('response');
        const carTable = document.getElementById('carTable');
        const carTableBody = carTable.querySelector('tbody');

        fetchCarsButton.addEventListener('click', async () => {
            const url = `/warehouse/returncar`; 
            try {
                const response = await fetch(url);
                const result = await response.json();

                responseDiv.style.display = 'none'; 
                carTableBody.innerHTML = ''; 

                if (!result || result.length === 0) {
                    responseDiv.innerText = 'No cars found.';
                    responseDiv.style.display = 'block';
                    carTable.style.display = 'none';
                    return;
                }

                carTable.style.display = 'table'; 

                result.forEach(car => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${car.id}</td>
                        <td>${car.plateNumber}</td>
                        <td>${car.brand}</td>
                        <td>${car.readyToReturn ? 'Yes' : 'No'}</td>
                    `;
                    carTableBody.appendChild(row);
                });
            } catch (error) {
                responseDiv.innerText = 'Car not found. Please check the plate number and try again.';
                responseDiv.style.display = 'block';
                carTable.style.display = 'none';
            }
        });
    </script>
</body>
</html>
