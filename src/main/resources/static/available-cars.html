<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>รถที่พร้อมใช้งาน</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #333;
            padding: 0;
            margin: 0;
        }

        .toolbar {
            background: linear-gradient(to right, #004080, #007BFF);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .toolbar a:hover {
            background-color: #0056b3;
            color: #e6f0ff;
        }

        h1 {
            color: #004080;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            background: linear-gradient(to right, #007BFF, #0056b3);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        button:hover {
            background-color: #003d80;
            transform: scale(1.05);
        }

        #carList {
            margin-top: 30px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .car-item {
            background: white;
            border: 2px solid #99ccff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 64, 128, 0.2);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .car-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 64, 128, 0.3);
        }

        .car-item h2 {
            color: #003366;
            margin-top: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .car-details p {
            margin: 5px 0;
        }

        .label {
            font-weight: bold;
            color: #004080;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="index.html">หน้าเริ่มต้น</a>
        <a href="available-cars.html">รถที่พร้อมใช้งาน</a>
    </div>

    <div class="header-container">
        <h1>ค้นหารถที่มีอยู่</h1>
        <div class="button-group">
            <button onclick="fetchAvailableCars()">ค้นหารถ</button>
            <button onclick="clearCarList()">ล้างการค้นหา</button>
        </div>
    </div>
    <div id="carList"></div>

    <script>
        function fetchAvailableCars() {
            fetch('http://localhost:8080/external/searchcar/available')
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    const carListDiv = document.getElementById('carList');
                    carListDiv.innerHTML = '';
                    if (data.length === 0) {
                        carListDiv.innerHTML = '<p>ไม่พบรถที่พร้อมใช้งาน</p>';
                    } else {
                        data.forEach(car => {
                            const carDiv = document.createElement('div');
                            carDiv.className = 'car-item';
                            carDiv.innerHTML = `
                                <h2>${car.carBrand} ${car.carModel}</h2>
                                <div class="car-details">
                                    <p><span class="label">ประเภท:</span> ${car.carType}</p>
                                    <p><span class="label">สี:</span> ${car.carColor}</p>
                                    <p><span class="label">ทะเบียน:</span> ${car.licensePlate}</p>
                                    <p><span class="label">ตำแหน่ง:</span> ${car.carLocation}</p>
                                    <p><span class="label">ประกัน:</span> ${car.carInsurance ? 'มี' : 'ไม่มี'}</p>
                                    <p><span class="label">สถานะ:</span> ${car.carStatus}</p>
                                    <p><span class="label">เลขไมล์:</span> ${car.milege}</p>
                                    <p><span class="label">ราคา/วัน:</span> $${car.price}</p>
                                    <button onclick="location.href='order.html?plate=${car.licensePlate}'">สั่งจองรถ</button>
                                </div>
                            `;
                            carListDiv.appendChild(carDiv);
                        });
                    }
                })
                .catch(error => {
                    console.error('เกิดข้อผิดพลาด:', error);
                    document.getElementById('carList').innerHTML = '<p>เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
                });
        }

        function clearCarList() {
            document.getElementById('carList').innerHTML = '';
        }
    </script>
</body>
</html>
