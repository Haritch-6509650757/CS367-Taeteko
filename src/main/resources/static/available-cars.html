<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Cars</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #333;
            padding: 0;
            margin: 0;
        }

        .toolbar {
            background: linear-gradient(to right, #004080, #007BFF);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .toolbar a:hover {
            background-color: #0056b3;
            color: #e6f0ff;
        }

        h1 {
            color: #004080;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            background: linear-gradient(to right, #007BFF, #0056b3);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        button:hover {
            background-color: #003d80;
            transform: scale(1.05);
        }

        #carList {
            margin-top: 30px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .car-item {
            background: white;
            border: 2px solid #99ccff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 64, 128, 0.2);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .car-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 64, 128, 0.3);
        }

        .car-item h2 {
            color: #003366;
            margin-top: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .car-details p {
            margin: 5px 0;
        }

        .label {
            font-weight: bold;
            color: #004080;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="index.html">Home</a>
        <a href="available-cars.html">Available Cars</a>
    </div>

    <div class="header-container">
        <h1>Search Available Cars</h1>
        <div class="button-group">
            <button onclick="fetchAvailableCars()">Search Cars</button>
            <button onclick="clearCarList()">Clear Search</button>
        </div>
    </div>
    <div id="carList"></div>

    <script>
        function fetchAvailableCars() {
            fetch('http://localhost:8080/external/searchcar/available')
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    const carListDiv = document.getElementById('carList');
                    carListDiv.innerHTML = '';
                    if (data.length === 0) {
                        carListDiv.innerHTML = '<p>No available cars found</p>';
                    } else {
                        data.forEach(car => {
                            const carDiv = document.createElement('div');
                            carDiv.className = 'car-item';
                            carDiv.innerHTML = `
                                <h2>${car.carBrand} ${car.carModel}</h2>
                                <div class="car-details">
                                    <img src=${car.img} alt="Car Image" style="width:100%; border-radius: 10px; margin-bottom: 10px;">
                                    <p><span class="label">Type:</span> ${car.carType}</p>
                                    <p><span class="label">Color:</span> ${car.carColor}</p>
                                    <p><span class="label">License Plate:</span> ${car.licensePlate}</p>
                                    <p><span class="label">Location:</span> ${car.carLocation}</p>
                                    <p><span class="label">Insurance:</span> ${car.carInsurance ? 'Yes' : 'No'}</p>
                                    <p><span class="label">Status:</span> ${car.carStatus}</p>
                                    <p><span class="label">Mileage:</span> ${car.milege}</p>
                                    <p><span class="label">Price/Day:</span> $${car.price}</p>
                                    <button onclick="location.href='order.html?plate=${car.licensePlate}'">Order Car</button>
                                </div>
                            `;
                            carListDiv.appendChild(carDiv);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error occurred:', error);
                    document.getElementById('carList').innerHTML = '<p>Error loading data</p>';
                });
        }

        function clearCarList() {
            document.getElementById('carList').innerHTML = '';
        }
    </script>
</body>
</html>
